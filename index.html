<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 class="sr-only">Simple Calculator</h1>

    <div class="calculator" aria-label="Simple calculator">
      <input id="display" class="display" type="text" inputmode="none" aria-label="Calculator display" readonly />

      <div class="keys" role="group" aria-label="Calculator keys">
        <button type="button" class="key control" data-action="clear">C</button>
        <button type="button" class="key control" data-action="delete">⌫</button>
        <button type="button" class="key operator" data-value="(">(</button>
        <button type="button" class="key operator" data-value=")">)</button>

        <button type="button" class="key operator" data-value="÷">÷</button>
        <button type="button" class="key" data-value="7">7</button>
        <button type="button" class="key" data-value="8">8</button>
        <button type="button" class="key" data-value="9">9</button>

        <button type="button" class="key operator" data-value="×">×</button>
        <button type="button" class="key" data-value="4">4</button>
        <button type="button" class="key" data-value="5">5</button>
        <button type="button" class="key" data-value="6">6</button>

        <button type="button" class="key operator" data-value="-">−</button>
        <button type="button" class="key" data-value="1">1</button>
        <button type="button" class="key" data-value="2">2</button>
        <button type="button" class="key" data-value="3">3</button>

        <button type="button" class="key operator" data-value="+">+</button>
        <button type="button" class="key zero" data-value="0">0</button>
        <button type="button" class="key" data-value=".">.</button>
        <button type="button" class="key equal" data-action="evaluate">=</button>
      </div>
    </div>

    <p class="hint">You can also use your keyboard: numbers, + - * / ( ), Enter = evaluate, Backspace = delete, Esc = clear.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
